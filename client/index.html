<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UZQUIZ — Bilimingni sinab ko‘r</title>
    <meta name="description" content="UZQUIZ — do‘stlaring bilan real vaqtda quiz o‘yna, jamoa top va yetakchiga aylan." />
    <meta name="theme-color" content="#0B0A14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('uzquiz-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('uzquiz-lang');
        if (l === 'uz' || l === 'ru' || l === 'en') document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
